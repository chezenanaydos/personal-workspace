<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Zen Space</title>

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Icons (BoxIcons) -->
    <!-- Basic Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <!-- Filled Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <!-- Brand Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- Top Header Bar -->
    <header class="workspace-header">
        <div class="header-left">

            <!-- Nav Toggle Button (visible when sidebar is closed) -->
            <button class="nav-btn header-nav-toggle" id="sidebar-toggle" title="Toggle Navigation"
                aria-label="Toggle navigation">
                <i class="bx bx-menu"></i>
            </button>

            <!-- Sidebar Brand (visible when sidebar is open) -->
            <div class="sidebar-brand-wrapper" id="sidebar-brand-wrapper">
                <div class="nav-logo" title="Zen Space">
                    <i class="bxl bx-github"></i>
                    <span class="nav-logo-text">Zen Space</span>
                </div>
            </div>

            <!-- Page Title -->
            <div class="header-title-group">
                <h1>Workspace</h1>
            </div>
        </div>

        <!-- Timer Widget -->
        <div class="header-actions">
            <div class="timer-widget" id="timer-widget">
                <div class="timer-display-group">
                    <span class="timer-display" id="timer-display">00:00:00</span>
                    <div class="timer-controls">
                        <input class="timer-input" id="timer-hours" type="number" min="0" max="23" value="0"
                            placeholder="HH" aria-label="Hours">
                        <span class="timer-sep">:</span>
                        <input class="timer-input" id="timer-minutes" type="number" min="0" max="59" value="0"
                            placeholder="MM" aria-label="Minutes">
                        <span class="timer-sep">:</span>
                        <input class="timer-input" id="timer-seconds" type="number" min="0" max="59" value="0"
                            placeholder="SS" aria-label="Seconds">
                    </div>
                </div>
                <div class="timer-actions">
                    <button class="timer-btn" id="timer-start" title="Start Timer"><i class="bx bx-play"></i></button>
                    <button class="timer-btn" id="timer-pause" title="Pause Timer" style="display:none"><i
                            class="bx bx-pause"></i></button>
                    <button class="timer-btn" id="timer-reset" title="Reset Timer"><i class="bx bx-undo"></i></button>
                    <button class="timer-btn timer-btn-alarm" id="timer-alarm-toggle" title="Alarm Off">
                        <i class="bx bx-bell-slash"></i></button>
                </div>
            </div>
        </div>
    </header>

    <!-- Workspace Layout Container -->
    <div class="workspace-container">

        <!-- Sidebar Navigation -->
        <nav id="workspace-sidebar">

            <!-- Primary Navigation List -->
            <div class="navigation-buttons">
                <ul>
                    <li>
                        <a href="#Workspace" class="active">
                            <i class="bx bx-briefcase"></i>
                            <span>Workspace</span>
                        </a>
                    </li>
                    <li>
                        <a href="#calendar">
                            <i class="bx bx-calendar"></i>
                            <span>Calendar</span>
                        </a>
                    </li>
                    <li>
                        <a href="#project-manager">
                            <i class="bx bx-briefcase-alt-2"></i>
                            <span>Project Manager</span>
                        </a>
                    </li>
                    <li>
                        <a href="#notepad">
                            <i class="bx bx-edit-alt"></i>
                            <span>Notepad</span>
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Nav Separator -->
            <div class="separator"></div>

            <!-- Secondary Links -->
            <div class="navigation-buttons">
                <ul>
                    <li>
                        <a href="#notebook">
                            <i class="bx bx-book-open"></i>
                            <span>Notebook</span>
                        </a>
                    </li>
                    <li>
                        <a href="#typing-test">
                            <i class="bx bx-keyboard"></i>
                            <span>Typing Test</span>
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Nav Separator -->
            <div class="separator"></div>

            <!-- Nav Footer Controls -->
            <div class="nav-footer">
                <button class="footer-btn" id="theme-toggle" title="Theme">
                    <i class="bx bx-moon"></i>
                    <span>mode</span>
                </button>
                <button class="footer-btn" id="volume-toggle" title="Volume">
                    <i class="bx bx-volume-full"></i>
                    <span>volume</span>
                </button>
                <button class="footer-btn" id="settings-btn" title="Settings">
                    <i class="bx bx-cog"></i>
                    <span>settings</span>
                </button>
            </div>

        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="workspace-body">

                <!-- =============================================
                     WORKSPACE SECTION
                     ============================================= -->
                <section id="Workspace" class="ws-section">
                    <div class="ws-grid">

                        <!-- LEFT COLUMN (60%) -->
                        <div class="ws-left">

                            <!-- Notepad Card -->
                            <div class="ws-card ws-notepad-card">
                                <div class="ws-card-header">
                                    <div class="ws-header-group">
                                        <span class="ws-card-title"><i class="bx bx-edit-alt"></i> Notes</span>
                                        <select class="ws-notes-select" id="notes-select"
                                            title="Single click to select, double tap to rename"
                                            aria-label="Select saved note">
                                            <!-- Dynamically populated -->
                                        </select>
                                        <input type="text" class="ws-notes-rename-input" id="notes-rename-input"
                                            style="display: none;" placeholder="Note title..." aria-label="Rename note">
                                    </div>
                                    <div class="ws-header-actions">
                                        <button class="btn-icon ws-btn-sm" id="note-add-btn" title="Add new note"
                                            aria-label="Add new note">
                                            <i class="bx bx-plus"></i>
                                        </button>
                                        <button class="btn-icon ws-btn-sm" id="note-delete-btn"
                                            title="Delete current note" aria-label="Delete current note">
                                            <i class="bx bx-trash"></i>
                                        </button>
                                    </div>
                                </div>
                                <textarea class="ws-notepad-area" id="notepad-area"
                                    placeholder="Start typing your notes here..." aria-label="Notepad"
                                    spellcheck="false"></textarea>
                            </div>

                            <!-- Task Schedule Table Card (Replaces Task Adder) -->
                            <div class="ws-card ws-schedule-card">
                                <div class="ws-card-header">
                                    <span class="ws-card-title"><i class="bx bx-calendar-event"></i> Task
                                        Schedule</span>
                                    <div class="ws-header-actions">
                                        <div class="ws-schedule-clock" id="schedule-clock"
                                            title="Philippine Time (GMT+8)">
                                            <i class="bx bx-time-five"></i>
                                            <span id="schedule-clock-time">--:--:--</span>
                                            <span class="ws-clock-tz">PH (GMT+8)</span>
                                        </div>
                                        <button class="btn-icon ws-btn-sm ws-clock-fmt-btn" id="clock-fmt-toggle"
                                            title="Toggle 12h / 24h format" aria-label="Toggle clock format">
                                            <span id="clock-fmt-label">24h</span>
                                        </button>
                                        <button class="btn-icon ws-btn-sm" id="schedule-add-btn"
                                            title="Add new task row" aria-label="Add task to schedule">
                                            <i class="bx bx-plus"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="ws-table-container">
                                    <table class="ws-schedule-table" id="schedule-table">
                                        <thead>
                                            <tr>
                                                <th class="col-drag"></th>
                                                <th class="col-name">Task Name</th>
                                                <th class="col-time">Time</th>
                                                <th class="col-status">Status</th>
                                                <th class="col-check">Done</th>
                                                <th class="col-del"></th>
                                            </tr>
                                        </thead>
                                        <tbody id="schedule-tbody">
                                            <!-- Rows populated by script.js -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                        </div>

                        <!-- RIGHT COLUMN (40%) -->
                        <div class="ws-right">

                            <!-- Tasks List Card -->
                            <div class="ws-card ws-tasks-card">
                                <div class="ws-card-header">
                                    <span class="ws-card-title"><i class="bx bx-check-square"></i> Tasks</span>
                                    <button class="btn-icon ws-btn-sm" id="quick-task-add-btn" title="Add task item"
                                        aria-label="Add task item">
                                        <i class="bx bx-plus"></i>
                                    </button>
                                </div>
                                <ul class="ws-quick-list" id="quick-task-list">
                                    <!-- Items populated by script.js -->
                                </ul>
                            </div>

                        </div>

                    </div>
                </section>

                <!-- Other sections go below -->

            </div>
        </main>

    </div>

</body>

</html>
